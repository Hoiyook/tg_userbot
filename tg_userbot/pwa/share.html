<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>分享到下载器</title>
<style>
  :root { --bg:#f4f6f9; --card:#ffffff; --line:#e5e9f0; --tx:#111827;
          --tx2:#64748b; --tx3:#94a3b8; --blue:#2563eb; --green:#16a34a;
          --green-bg:#ecfdf5; --red:#dc2626; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--tx);
         font-family:-apple-system,"PingFang SC",sans-serif; font-size:15px; }
  .wrap { padding:24px 18px; max-width:560px; margin:0 auto; }
  h1 { font-size:22px; font-weight:800; margin:28px 0 6px; }
  .sub { color:var(--tx2); font-size:13px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:14px; margin-bottom:14px; box-shadow:0 1px 2px rgba(16,24,40,.04); }
  .body { font-size:13px; color:#334155; line-height:1.6; word-break:break-all;
          background:#f1f5f9; border-radius:10px; padding:10px 12px; }
  input[type=text], input[type=password] { width:100%; background:#fff;
        border:1px solid var(--line); color:var(--tx); border-radius:10px;
        padding:11px 12px; font-size:14px; margin-bottom:10px; }
  input::placeholder { color:var(--tx3); }
  button { width:100%; background:var(--blue); color:#fff; border:0;
           border-radius:12px; padding:13px; font-size:15px; font-weight:700; }
  button.ghost { background:#fff; color:var(--tx); border:1px solid var(--line);
                 margin-top:10px; font-weight:500; }
  .fb { font-size:14px; margin-top:12px; line-height:1.6; word-break:break-all; }
  .fb.ok { color:var(--green); font-weight:700; }
  .fb.bad { color:var(--red); }
  .meta { color:var(--tx3); font-size:12px; margin-top:16px; line-height:1.7; }
  a { color:var(--blue); }
</style>
</head>
<body>
<div class="wrap">
  <h1>📤 分享到下载器</h1>
  <div class="sub">识别链接类型后分流：抖音/B站本地解析、种子转 115 离线、其余登记外链台账</div>
  <div class="card">
    <div class="body" id="shared">读取分享内容…</div>
  </div>
  <div id="tokArea" style="display:none">
    <input type="password" id="tok" placeholder="访问令牌（首次填一次，记住）">
  </div>
  <button id="go" onclick="submit()">📥 加入下载队列</button>
  <div class="fb" id="fb"></div>
  <div class="meta">提交后由 userbot 分流处理，完成通知发到 Telegram 控制面板。<br>
    <a href="/?source=share">打开完整看板 →</a></div>
</div>
<script>
const p = new URLSearchParams(location.search);
const text = [p.get("title"), p.get("text"), p.get("url")]
  .filter(Boolean).join(" ").trim();
// 幂等键：同一页面内重复点提交/超时重试复用同一 id，服务端只受理一次。
// 非 HTTPS（局域网 http）没有 crypto.randomUUID，退回 Math.random。
function newReqId() {
  try {
    if (window.crypto && crypto.randomUUID)
      return crypto.randomUUID().replace(/-/g, "");
  } catch (e) { /* 非安全上下文 */ }
  return Array.from({ length: 32 },
    () => Math.floor(Math.random() * 16).toString(16)).join("");
}
const REQ = newReqId();
const TOK = () => localStorage.getItem("nagram_token") || "";
if (p.get("token")) { localStorage.setItem("nagram_token", p.get("token")); }
document.getElementById("shared").textContent = text || "（未收到内容）";

async function api(path, opts) {
  const r = await fetch(path, Object.assign({
    headers: Object.assign({ "Content-Type": "application/json" },
                           { "X-Token": TOK() }) }, opts||{}));
  if (r.status === 401) {
    const t = prompt("访问令牌：");
    if (t) { localStorage.setItem("nagram_token", t); return api(path, opts); }
    throw new Error("未授权");
  }
  return r.json();
}

async function submit() {
  const fb = document.getElementById("fb");
  fb.className = "fb"; fb.textContent = "提交中…（本地解析最长约 30s/条）";
  try {
    const d = await api("/api/enqueue", { method: "POST",
      body: JSON.stringify({ text, request_id: REQ }) });
    fb.className = "fb " + (d.ok ? "ok" : "bad");
    fb.textContent = (d.ok ? "✅ " : "❌ ") + (d.message || d.error || "");
  } catch (e) { fb.className = "fb bad"; fb.textContent = "❌ " + e; }
}

if (text) { /* 自动提交？不——留给用户确认（分享可能带标题噪声） */ }
else { document.getElementById("go").disabled = true;
       document.getElementById("go").textContent = "无分享内容"; }
document.getElementById("go").addEventListener("click", submit);
</script>
</body>
</html>
